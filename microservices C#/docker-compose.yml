services:
  auth_db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: auth_db
      MYSQL_USER: auth_user
      MYSQL_PASSWORD: auth_password
    ports:
      - "3319:3306"
    volumes:
      - auth_db_data_cs:/var/lib/mysql
      - ./Scripts.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cinema_network_cs
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  cinema_db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: cinema_db
      MYSQL_USER: auth_user
      MYSQL_PASSWORD: auth_password
    ports:
      - "3317:3306"
    volumes:
      - cinema_db_data_cs:/var/lib/mysql
      - ./Scripts.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cinema_network_cs
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  order_db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: order_db
      MYSQL_USER: auth_user
      MYSQL_PASSWORD: auth_password
    ports:
      - "3318:3306"
    volumes:
      - order_db_data_cs:/var/lib/mysql
      - ./Scripts.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cinema_network_cs
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth_service:
    build:
      context: ./auth_service
    environment:
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__Default: Server=auth_db;Port=3306;Database=auth_db;User=auth_user;Password=auth_password;
      Jwt__Secret: cinema-sa-dev-secret-csharp-version-keep-long
      Jwt__ExpiresInHours: 24
    ports:
      - "5100:5000"
    depends_on:
      auth_db:
        condition: service_healthy
    networks:
      - cinema_network_cs

  cinema_service:
    build:
      context: ./cinema_service
    environment:
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__Default: Server=cinema_db;Port=3306;Database=cinema_db;User=auth_user;Password=auth_password;
      Jwt__Secret: cinema-sa-dev-secret-csharp-version-keep-long
      Jwt__ExpiresInHours: 24
    ports:
      - "5101:5000"
    depends_on:
      cinema_db:
        condition: service_healthy
    networks:
      - cinema_network_cs

  order_service:
    build:
      context: ./order_service
    environment:
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__Default: Server=order_db;Port=3306;Database=order_db;User=auth_user;Password=auth_password;
      CinemaService__Url: http://cinema_service:5000/api
      Jwt__Secret: cinema-sa-dev-secret-csharp-version-keep-long
      Jwt__ExpiresInHours: 24
    ports:
      - "5102:5000"
    depends_on:
      order_db:
        condition: service_healthy
    networks:
      - cinema_network_cs

  api_gateway:
    build:
      context: ../api_gateway C#
    environment:
      ASPNETCORE_URLS: http://+:8080
      AUTH_SERVICE_URL: http://auth_service:5000
      CINEMA_SERVICE_URL: http://cinema_service:5000
      ORDER_SERVICE_URL: http://order_service:5000
    ports:
      - "8081:8080"
    depends_on:
      - auth_service
      - cinema_service
      - order_service
    networks:
      - cinema_network_cs

volumes:
  auth_db_data_cs:
  cinema_db_data_cs:
  order_db_data_cs:

networks:
  cinema_network_cs:
    driver: bridge

